services:
  # Backend Node.js su Render
  - type: web
    name: ultimaora-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: ALLOWED_ORIGINS
        value: https://ultimaora.vercel.app
      - key: CACHE_TTL_MINUTES
        value: 5
    healthCheckPath: /api/health
    autoDeploy: true
